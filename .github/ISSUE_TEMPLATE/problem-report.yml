name: Problem report · 问题反馈
description: Installation, behavior, metadata, or risk notices without sensitive details. · 添加、使用、元数据问题，或不含敏感细节的风险提示。
title: "[Problem] "
labels: ["problem"]
body:
  - type: markdown
    attributes:
      value: |
        Public issues are the default for problems and unsafe resources. For potentially high-impact issues, we recommend emailing security@teloa.ai privately first. Keep credentials, private data, and exploit details out of public reports; see SECURITY.md.
        问题或不安全的资源默认在此公开报告；如可能造成重大影响，建议先私下发邮件至 security@teloa.ai。公开内容请去除凭据、隐私和漏洞利用细节，详见 SECURITY.md。
  - type: input
    id: entry
    attributes:
      label: Entry ID and version · 条目 ID 与版本
      placeholder: teloa.soc@1.0.1
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Teloa version · Teloa 版本
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened · 发生了什么
      description: Steps, expected result and actual result. Remove secrets and personal data. · 步骤、预期与实际结果；请去掉密钥与个人信息。
    validations:
      required: true
