name: Generate

# Submission pull requests change only catalog/, artifacts/ and reviews/, so they never conflict with each other.
# After they land on main, this workflow bumps catalog-version.txt, prepends a CHANGELOG.md section, regenerates
# INDEX.md, NOTICE and the README catalog version, validates the result strictly and proposes it in one pull request
# from bot/generated-files. The main branch ruleset accepts changes only through pull requests and GitHub Actions
# cannot bypass it, so the workflow opens a pull request instead of pushing to main; a maintainer or the operations
# harness merges it. No loop: merging that pull request re-runs this workflow, which finds nothing to change.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run at a time; a newer push replaces a queued run, and every run starts from the latest main.
concurrency:
  group: generate-main
  cancel-in-progress: false

jobs:
  generate:
    name: Generated files
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push bot/generated-files (not main)
      pull-requests: write # open or update the generated-files pull request
      actions: write # dispatch Validate on bot/generated-files: events from GITHUB_TOKEN do not start pull_request runs
    env:
      BRANCH: bot/generated-files
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Bump catalog version and prepend changelog section
        run: node .github/scripts/prepare-generated.mjs

      - name: Regenerate INDEX.md, NOTICE and README catalog version
        run: node tools/validate.mjs --write

      - name: Validate strictly (generated files must be current)
        run: node tools/validate.mjs

      - name: Commit, push and open the pull request
        run: |
          if git diff --quiet; then
            echo "Generated files are up to date; nothing to propose."
            exit 0
          fi
          source=$(git rev-parse HEAD)
          version=$(cat catalog-version.txt)
          git add -- INDEX.md NOTICE README.md README.zh-CN.md catalog-version.txt CHANGELOG.md
          if ! git diff --quiet; then
            echo "::error::Unexpected changes outside the generated files:"; git status --short; exit 1
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -s -m "chore(catalog): generated files for $version" -m "Catalog-Source: $source"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" "HEAD:refs/heads/$BRANCH"

          title="chore(catalog): generated files for $version"
          body=$(printf '%s\n\n%s\n\n%s\n\n%s' \
            "Generated by the Generate workflow from main at $source: catalog-version.txt, CHANGELOG.md, INDEX.md, NOTICE and the README catalog version. Do not edit this branch by hand; it is rebuilt after every merge to main. Merging publishes catalog version $version." \
            "由 Generate 工作流从 main $source 生成：目录版本、变更日志、INDEX.md、NOTICE 与 README 目录版本。请勿手改本分支，每次合入 main 后会重建。合并即发布目录版本 $version。" \
            "Checks run through workflow_dispatch (strict validation); the DCO job is skipped there and the bot commit is signed off." \
            "Catalog-Source: $source")
          pr=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "$title" --body "$body"
          elif ! gh pr create --base main --head "$BRANCH" --title "$title" --body "$body"; then
            echo "::warning::GITHUB_TOKEN could not open the pull request. Enable 'Allow GitHub Actions to create and approve pull requests' in the repository settings, or open it from https://github.com/${GH_REPO}/compare/main...${BRANCH}"
          fi
          # Pull request events caused by GITHUB_TOKEN start no workflow runs, so start Validate on the branch
          # explicitly; its check runs attach to the pushed commit and satisfy the required status checks.
          gh workflow run validate.yml --ref "$BRANCH"
